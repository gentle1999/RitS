defaults:
  - dpa_ts_finetune
  - _self_

run_name: dpa_ts_finetune_full_v2_seed48
resume: null
finetune_from: data/rits.ckpt

train:
  # A long ceiling plus conservative early stopping lets the narrow-domain
  # adaptation converge while retaining checkpoints for fixed-seed RMSD sweeps.
  n_epochs: 500
  checkpoint_every_n_train_steps: 250
  early_stopping:
    monitor: val/loss
    mode: min
    min_delta: 1.0e-4
    patience: 80

data:
  # MiDi's adaptive collater intentionally drops overflow graphs. Keep it for
  # high-throughput training, but evaluate every validation graph each epoch.
  validation_data_loader_type: standard

lr_scheduler:
  type: linear_warmup_decay
  initial_lr: 1.0e-6
  final_lr: 1.0e-5
  num_warmup_steps: 500
  milestone_steps: 500
  num_decay_steps: 4500
  min_lr_decay: 1.0e-6
  interval: step
  frequency: 1
