run_name: dpa_ts_finetune_rits_seed48
outdir: outputs
resume: null
finetune_from: data/rits.ckpt

ema: true
wandb_params:
  mode: offline
  group: dpa_ts_finetune
  project: chembl3d_megalodon_diffusion

data:
  dataset_root: data/dpa_ts_stereo_clean
  processed_folder: processed
  # High-memory single-GPU reference batch size for the 96 GiB workstation GPU.
  batch_size: 1000
  inference_batch_size: 1000
  data_loader_type: midi
  aug_rotations: false
  scale_coords: &scale_coords 1.0
  ts_ratio: 1.0

loss:
  use_loss_clamps: true
  loss_clamp_epoch_threshold: 3
  loss_clamps:
    ts_coord: 1.0
  variables:
    - variable_name: ts_coord
      loss_scale: 1.0
      aggregate: mean
      continuous: true
      loss_type: mse
      use_distance: null
      distance_scale: null

interpolant:
  timesteps: &timesteps 25
  time_type: &time_type continuous
  sample_time_method: uniform
  sample_time_mean: 0
  sample_time_scale: 1.0
  global_variable_name: ts_coord
  min_t: &min_t 0.0
  variables:
    - variable_name: ts_coord
      interpolant_type: continuous_flow_matching
      prediction_type: velocity
      optimal_transport: rigid
      prior_type: gaussian
      timesteps: *timesteps
      num_classes: 3
      scheduler_type: linear
      scheduler_cut: false
      time_type: *time_type
      min_t: *min_t
      com_free: true
      noise_sigma: 0.0
      inference_noise_sigma: 0.0
    - variable_name: numbers
      interpolant_type: discrete_null
      num_classes: 54
      prior_type: null
    - variable_name: bmat_r
      interpolant_type: discrete_null
      num_classes: 9
      prior_type: null
    - variable_name: bmat_p
      interpolant_type: discrete_null
      num_classes: 9
      prior_type: null
    - variable_name: charges
      interpolant_type: discrete_null
      concat: numbers
      num_classes: 9
      offset: 4
      prior_type: null

dynamics:
  model_name: megav3ts
  model_args:
    atom_classes: 63
    edge_classes: 9
    invariant_edge_feat_dim: 64
    invariant_node_feat_dim: 256
    n_vector_features: 64
    equivariant_node_feature_dim: 3
    num_layers: 10
    num_heads: 4
    dist_size: 16
    prune_edges: false
  wrapper_args:
    timesteps: *timesteps
    time_type: *time_type

sample:
  node_distribution: null
  return_step_output: true

train:
  seed: 48
  gpus: 1
  n_epochs: 100
  enable_progress_bar: true
  gradient_clip_value: 1.0
  log_freq: 25
  val_freq: 1
  checkpoint_monitor: val/loss
  checkpoint_monitor_mode: min
  checkpoint_every_n_train_steps: 500
  max_steps: -1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 0

# Validation loss is sufficient during fine-tuning; structure sampling can be
# run separately from saved checkpoints without slowing every validation epoch.
evaluation: null

optimizer:
  type: adamw
  lr: 1.0e-5
  weight_decay: 1.0e-12
  amsgrad: true

lr_scheduler:
  type: linear_warmup
  initial_lr: 1.0e-6
  final_lr: 1.0e-5
  num_warmup_steps: 500
  interval: step
  frequency: 1
