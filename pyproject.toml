[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megalodon"
readme = "README.md"
description = "Right into the Saddle: Stereochemistry-Aware Generation of Molecular Transition States"
authors = [
    { name = "Filipp Nikitin", email = "filipp.nikitin.96@gmail.com" }
]
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dynamic = ["version"]
dependencies = [
    # external
    'torch>=2.12,<2.13',
    'torch-geometric>=2.8,<3',
    'torch-sparse>=0.6.18,<0.7',
    'torch-scatter>=2.1.2,<2.2',
    'hydra-core>=1.3.2,<2',
    'omegaconf>=2.3.0,<3',
    'rdkit>=2025.3.2,<2027',
    'lightning>=2.5.1,<3',
    'einops>=0.8.1,<1',
    'wandb>=0.19.11,<1',
    'zarr>=2.18.3,<3',
    'numcodecs>=0.13.1,<0.16,!=0.14.0,!=0.14.1',
    'h5py>=3.9,<4',
    'numpy>=1.24,<3',
    'pandas>=2.2.3,<3',
    'scipy>=1.10,<2',
    'tqdm>=4.67.1,<5',
]

[project.urls]
Paper = "https://doi.org/10.26434/chemrxiv.15001681/v1"
Repository = "https://github.com/isayevlab/rits"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = true


[tool.setuptools.dynamic]
version = { file = "VERSION" }
